<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fde">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Belajar">
  <title>Listen · Belajar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/boot.js"></script>
  <script type="module" src="js/listen.js"></script>
</head>
<body class="practice">
  <header class="topbar">
    <a class="btn icon-btn" href="hanzi.html" id="back-btn" aria-label="Back to lesson">‹</a>
    <a class="btn icon-btn" href="index.html" id="home-btn" aria-label="Home">⌂</a>
    <div id="logo" class="logo small" role="img" aria-label="Belajar">学</div>
    <h1 id="page-title">Listen</h1>
    <span class="counter" id="counter" aria-live="polite"></span>
  </header>

  <!-- Layar 1: mulai (suara harus dipicu oleh tap) -->
  <main id="screen-start" class="screen">
    <h2>Listen, then pick the meaning</h2>
    <p class="muted">Dengarkan, lalu pilih artinya.</p>
    <p class="big-note" id="start-note"></p>
    <p class="voice-note" id="voice-note" hidden></p>
    <button class="btn primary big" id="start-btn" type="button">Start</button>
  </main>

  <!-- Layar 2: soal -->
  <main id="screen-question" class="screen" hidden>
    <div class="card sentence-card">
      <button class="btn speak-btn big" id="listen-btn" type="button">🔊 Listen again</button>
      <div class="answer" id="reveal" hidden>
        <div class="sentence small" id="q-hanzi" lang="zh-CN"></div>
        <div class="pinyin small" id="q-pinyin"></div>
      </div>
    </div>
    <div class="choice-col" id="options" role="group" aria-label="Choose the meaning" lang="id"></div>
    <p class="step-msg" id="feedback" aria-live="polite"></p>
    <div class="actions">
      <button class="btn primary big" id="next-btn" type="button" hidden>Next ›</button>
    </div>
  </main>

  <main id="screen-done" class="screen" hidden>
    <h2>Good listening! 🎧</h2>
    <p class="big-note" id="done-summary"></p>
    <div class="actions">
      <a class="btn big" href="hanzi.html" id="done-lesson">Lesson</a>
      <a class="btn primary big" href="index.html">Home</a>
    </div>
  </main>

  <div id="oops" class="oops" hidden>
    <div class="oops-box">
      <h2>Oops! Let's try again.</h2>
      <p>Ups, coba lagi.</p>
      <a class="btn primary" href="index.html">Home</a>
    </div>
  </div>
</body>
</html>
