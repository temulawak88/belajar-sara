<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fde">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Belajar">
  <title>Mandarin · Belajar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/boot.js"></script>
  <script type="module" src="js/hanzi.js"></script>
</head>
<body class="practice">
  <header class="topbar">
    <a class="btn icon-btn" href="index.html" id="home-btn" aria-label="Home">⌂</a>
    <div id="logo" class="logo small" role="img" aria-label="Belajar">学</div>
    <h1>Mandarin flashcards</h1>
    <span class="counter" id="counter" aria-live="polite"></span>
  </header>

  <!-- Layar 1: kotak Leitner -->
  <main id="screen-start" class="screen">
    <h2>Your 5 boxes</h2>
    <p class="muted">Cards move up a box when you know them. (Kartu naik kotak kalau kamu ingat.)</p>
    <ol class="boxes" id="boxes" aria-label="Leitner boxes"></ol>
    <p class="big-note" id="start-note"></p>
    <button class="btn primary big" id="start-btn" type="button">Start</button>
    <a class="btn big" href="write.html" id="go-write">✍️ Writing practice</a>
  </main>

  <!-- Layar 2: kartu -->
  <main id="screen-card" class="screen" hidden>
    <div class="card" id="card">
      <span class="tag" id="card-tag" hidden>Practice again</span>
      <div class="hanzi" id="card-hanzi" lang="zh-CN"></div>
      <div class="answer" id="card-answer" hidden>
        <div class="pinyin" id="card-pinyin"></div>
        <div class="meaning-en" id="card-en"></div>
        <div class="meaning-id" id="card-id" lang="id"></div>
      </div>
      <button class="btn speak-btn" id="speak-btn" type="button" aria-label="Listen">🔊 Listen</button>
      <p class="voice-note" id="voice-note" hidden></p>
    </div>
    <div class="actions" id="reveal-row">
      <button class="btn primary big" id="reveal-btn" type="button">Show answer</button>
    </div>
    <div class="actions" id="grade-row" hidden>
      <button class="btn big notyet" id="notyet-btn" type="button">Not yet</button>
      <button class="btn big knew" id="knew-btn" type="button">I knew it!</button>
    </div>
  </main>

  <!-- Layar 3: selesai -->
  <main id="screen-done" class="screen" hidden>
    <h2>Great job! 🎉</h2>
    <p class="big-note" id="done-summary"></p>
    <p class="muted">See you tomorrow! (Sampai besok!)</p>
    <a class="btn primary big" href="index.html">Home</a>
  </main>

  <div id="oops" class="oops" hidden>
    <div class="oops-box">
      <h2>Oops! Let's try again.</h2>
      <p>Ups, coba lagi.</p>
      <a class="btn primary" href="index.html">Home</a>
    </div>
  </div>
</body>
</html>
