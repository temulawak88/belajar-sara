<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fde">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Belajar">
  <title>Word problem · Belajar</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/boot.js"></script>
  <script type="module" src="js/mathq.js"></script>
</head>
<body class="practice">
  <header class="topbar">
    <a class="btn icon-btn" href="math.html" id="back-btn" aria-label="Back to chapters">‹</a>
    <a class="btn icon-btn" href="index.html" id="home-btn" aria-label="Home">⌂</a>
    <div id="logo" class="logo small" role="img" aria-label="Belajar">学</div>
    <h1 id="page-title">Word problem</h1>
    <span class="counter" id="counter" aria-live="polite"></span>
  </header>

  <!-- Soal cerita: baca (kata sulit bisa di-tap), hitung, isi jawaban dengan keypad sendiri -->
  <main id="screen-question" class="screen math-screen" hidden>
    <div class="math-layout">
      <div class="math-left">
        <div class="card story-card">
          <span class="tag" id="level-tag"></span>
          <p class="story" id="story"></p>
          <p class="glossary-note" id="glossary-note" aria-live="polite">Tap a blue word to see its meaning. (Ketuk kata biru untuk melihat artinya.)</p>
          <div class="pie-box" id="pie-box" hidden></div>
        </div>
        <div class="hint-box" id="hint-box" aria-live="polite" hidden>
          <p class="hint-title" id="hint-title"></p>
          <ul id="hint-items" lang="id"></ul>
        </div>
      </div>
      <div class="math-right">
        <div class="answer-row">
          <span class="answer-prefix" id="answer-prefix"></span>
          <output class="answer-display" id="answer-display" aria-label="Your answer"></output>
          <span class="answer-unit" id="answer-unit"></span>
        </div>
        <div class="keypad" id="keypad" role="group" aria-label="Number keypad"></div>
        <div class="actions">
          <button class="btn primary big" id="check-btn" type="button">Check</button>
          <button class="btn primary big" id="next-btn" type="button" hidden>Next ›</button>
        </div>
      </div>
    </div>
  </main>

  <main id="screen-done" class="screen" hidden>
    <h2>Good thinking! 🧮</h2>
    <p class="big-note" id="done-summary"></p>
    <p class="muted">See you tomorrow! (Sampai besok!)</p>
    <div class="actions">
      <a class="btn big" href="math.html">Chapters</a>
      <a class="btn primary big" href="index.html">Home</a>
    </div>
  </main>

  <div id="oops" class="oops" hidden>
    <div class="oops-box">
      <h2>Oops! Let's try again.</h2>
      <p>Ups, coba lagi.</p>
      <a class="btn primary" href="index.html">Home</a>
    </div>
  </div>
</body>
</html>
